version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cko_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_secret_change_in_prod
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vault_user -d cko_vault']
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://vault_user:vault_secret_change_in_prod@postgres:5432/cko_vault
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
